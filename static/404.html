<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Not found</title>
		<meta name="robots" content="noindex" />
		<style>
			:root {
				color-scheme: light dark;
				--paper: light-dark(#f7f2e8, #171613);
				--ink: light-dark(#22201b, #ece7db);
				--muted: light-dark(#6d675b, #a29a8b);
				--accent: light-dark(#5f7f52, #9ec28f);
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: var(--paper);
				color: var(--ink);
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
				padding: 2rem;
			}
			main {
				max-width: 32rem;
			}
			p.kicker {
				font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
				font-size: 0.72rem;
				letter-spacing: 0.16em;
				text-transform: uppercase;
				color: var(--accent);
				margin: 0 0 1rem;
			}
			h1 {
				font-family: ui-serif, Georgia, 'Iowan Old Style', Palatino, serif;
				font-weight: 500;
				font-size: clamp(2rem, 6vw, 2.75rem);
				line-height: 1.1;
				letter-spacing: -0.015em;
				margin: 0 0 1rem;
			}
			p.body {
				color: var(--muted);
				line-height: 1.6;
				margin: 0 0 2rem;
			}
			a {
				display: inline-block;
				padding: 0.65rem 1.15rem;
				border-radius: 999px;
				background: var(--ink);
				color: var(--paper);
				text-decoration: none;
				font-size: 0.9rem;
			}
			a:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 3px;
			}
		</style>
	</head>
	<body>
		<main>
			<p class="kicker">404</p>
			<h1>This page isn’t here.</h1>
			<p class="body">
				The link may be old, or the page may have moved. Either way, there is nothing at this address.
			</p>
			<!-- "./" resolves correctly for both user sites and project sites. -->
			<a href="./">Go home</a>
		</main>
	</body>
</html>
